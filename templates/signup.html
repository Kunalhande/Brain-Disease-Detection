<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('/static/signup_bg.jpg') no-repeat center fixed;
            background-size: cover;
            position: relative;
        }

        /* Dark overlay for better readability */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .card-container {
            position: relative;
            z-index: 2;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card shadow-lg p-4 rounded-4 card-container"
        style="width: 400px; background: rgba(255, 255, 255, 0.9);">
        <h3 class="text-center text-info mb-3 fw-bold">Create an Account</h3>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('signup') }}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" name="name" class="form-control" required placeholder="John Doe">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control" required placeholder="example@mail.com">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required
                    placeholder="Enter strong password">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Age</label>
                <input type="number" name="age" class="form-control" required placeholder="Enter your age">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Gender</label>
                <div class="d-flex">
                    <div class="form-check me-3">
                        <input type="radio" name="gender" value="male" class="form-check-input" required>
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check me-3">
                        <input type="radio" name="gender" value="female" class="form-check-input" required>
                        <label class="form-check-label">Female</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" name="gender" value="other" class="form-check-input" required>
                        <label class="form-check-label">Other</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Contact Number</label>
                <input type="text" name="contact" class="form-control" required pattern="[0-9]{10}"
                    placeholder="Enter 10-digit phone number">
            </div>

            <button type="submit" class="btn btn-info w-100 text-white btn-lg">Sign Up</button>
        </form>

        <div class="text-center mt-3">
            <small>Already have an account? <a href="{{ url_for('login') }}"
                    class="text-info fw-semibold">Login</a></small>
        </div>
        
        <div class="text-center mt-2">
            <small><a href="{{ url_for('home') }}" class="text-info fw-semibold">Go to Home</a></small>
        </div>
    </div>
</body>

</html>
